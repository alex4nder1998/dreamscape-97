<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;
uniform vec2 uRes;
uniform vec2 uOff;
uniform float uPix;
uniform vec3 uRo, uTa, uSun;
uniform int uN;
uniform vec4 uA[10];   // type, x, y, z
uniform vec4 uB[10];   // sx, sy, sz, rot
uniform vec4 uC[10];   // material, seed, tilt
uniform vec3 cTop, cHor, cSun, cHaze;
uniform float uClouds, uHaze, uFog, uStars, uSea, uSeaOn, uGround;
uniform vec4 uPl[2], uPlC[2], uPlC2[2];   // planets: dir+radius, colour+type (1 cratered, 2 banded, 3 banded+ring), second colour
uniform float uNoSun, uRays, uFlare, uSunVis, uLook, uCalm;
const mat2 M2 = mat2(0.8,-0.6,0.6,0.8);

float hash1(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash3(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
vec3 noised(vec2 x){
  vec2 i=floor(x), f=fract(x); vec2 u=f*f*(3.0-2.0*f), du=6.0*f*(1.0-f);
  float a=hash1(i), b=hash1(i+vec2(1,0)), c=hash1(i+vec2(0,1)), d=hash1(i+vec2(1,1)); float k=a-b-c+d;
  return vec3(a+(b-a)*u.x+(c-a)*u.y+k*u.x*u.y, du*(vec2(b-a,c-a)+k*u.yx));
}
float noise(vec2 x){ return noised(x).x; }
float noise3(vec3 x){
  vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm3(vec3 p){ float a=0.0,b=0.5; for(int i=0;i<5;i++){ a+=b*noise3(p); p=p*2.03+vec3(1.7,9.2,3.1); b*=0.5; } return a; }
mat2 rot2(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }

float terrainH(vec2 uv, float seed, int oct){
  vec2 p = uv*2.2 + vec2(seed*7.13, seed*3.71);
  float a=0.0, b=1.0; vec2 d=vec2(0.0);
  for(int i=0;i<8;i++){ if(i>=oct) break; vec3 n=noised(p); d+=n.yz; a+=b*n.x/(1.0+dot(d,d)); b*=0.5; p=M2*p*2.0; }
  float f = 1.0-smoothstep(0.3,1.0,length(uv));
  float x = max(a*0.95*f*(0.5+0.5*f), 0.0);
  return x<0.75 ? x : 0.75+0.25*tanh((x-0.75)/0.25);   // soft roll-off instead of a flat-cut summit
}
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
float dot2(vec2 v){ return dot(v,v); }
float sdCappedCone(vec3 p, float h, float r1, float r2){
  vec2 q=vec2(length(p.xz),p.y); vec2 k1=vec2(r2,h); vec2 k2=vec2(r2-r1,2.0*h);
  vec2 ca=vec2(q.x-min(q.x,(q.y<0.0)?r1:r2), abs(q.y)-h);
  vec2 cb=q-k1+k2*clamp(dot(k1-q,k2)/dot2(k2),0.0,1.0);
  float s=(cb.x<0.0 && ca.y<0.0)?-1.0:1.0;
  return s*sqrt(min(dot2(ca),dot2(cb)));
}
float sdPyramid(vec3 p, float h){
  float m2=h*h+0.25;
  p.xz=abs(p.xz); p.xz=(p.z>p.x)?p.zx:p.xz; p.xz-=0.5;
  vec3 q=vec3(p.z, h*p.y-0.5*p.x, h*p.x+0.5*p.y);
  float s=max(-q.x,0.0); float t=clamp((q.y-0.5*p.z)/(m2+0.25),0.0,1.0);
  float a=m2*(q.x+s)*(q.x+s)+q.y*q.y;
  float b=m2*(q.x+0.5*t)*(q.x+0.5*t)+(q.y-m2*t)*(q.y-m2*t);
  float d2=min(q.y,-q.x*m2-q.y*0.5)>0.0?0.0:min(a,b);
  return sqrt((d2+q.z*q.z)/m2)*sign(max(q.z,-p.y));
}
vec3 toLocal(int i, vec3 p){ vec3 q=p-uA[i].yzw; q.xz=rot2(-uB[i].w)*q.xz; q.yz=rot2(-uC[i].z)*q.yz; return q; }
float objSDF(int i, vec3 p, int oct){
  vec3 q=toLocal(i,p); vec3 s=uB[i].xyz; int t=int(uA[i].x+0.5);
  if(t==1){ float k0=length(q/s), k1=length(q/(s*s)); return k0*(k0-1.0)/k1; }
  if(t==2){ float r=0.04*min(s.x,min(s.y,s.z)); return sdBox(q,s-r)-r; }
  if(t==3){ vec2 d=vec2(length(q.xz)-s.x, abs(q.y)-s.y); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }
  if(t==4){ return sdCappedCone(q,s.y,s.x,0.0); }
  if(t==5){ float k=2.0*s.x; return sdPyramid(vec3(q.x,q.y+s.y,q.z)/k, s.y/s.x)*k; }
  if(t==6){ float R=max(s.x-s.y,0.05); return length(vec2(length(q.xz)-R,q.y))-s.y; }
  if(t==7){
    float b=sdBox(q,s); if(b>0.4) return b;
    float h=terrainH(q.xz/s.xz, uC[i].y, oct);
    float yh=-s.y+2.0*s.y*h;
    return max((q.y-yh)*0.42/(1.0+2.0*s.y/s.x), b);
  }
  if(t==8){
    float b=sdBox(q,s); if(b>0.4) return b;
    float h=sqrt(terrainH(q.xz/s.xz, uC[i].y, oct))-0.1;   // offset: zero height = empty, not an infinitely thin sheet
    return max((abs(q.y)-s.y*h)*0.42/(1.0+2.0*s.y/s.x), b);
  }
  return 1e5;
}
vec2 map(vec3 p, int oct){
  float d=1e5, id=-1.0;
  for(int i=0;i<10;i++){ if(i>=uN) break; float di=objSDF(i,p,oct); if(di<d){ d=di; id=float(i);} }
  return vec2(d,id);
}
vec2 march(vec3 ro, vec3 rd, float tmax, int steps, int oct){
  float t=0.02; vec2 h=vec2(1e5,-1.0);
  for(int i=0;i<400;i++){ if(i>=steps) break;
    h=map(ro+rd*t,oct);
    if(abs(h.x)<0.0006*t+0.0004) return vec2(t,h.y);
    t+=h.x; if(t>tmax) return vec2(1e9,-1.0); }
  // ran out of steps while still crawling along a surface (steep terrain faces): call it a hit, not sky
  if(h.y>=0.0 && h.x<0.004*t+0.01) return vec2(t,h.y);
  return vec2(1e9,-1.0);
}
float planeY(){ return uSeaOn>0.5 ? uSea : 0.0; }
vec2 hitScene(vec3 ro, vec3 rd, int steps, int oct){
  float pY=planeY();
  float tP=(rd.y<0.0 && ro.y>pY) ? (pY-ro.y)/rd.y : 1e9;
  vec2 h=march(ro,rd,min(tP,400.0),steps,oct);
  if(h.x<tP && h.x<1e8) return h;
  if(tP<1e8) return vec2(tP,-2.0);
  return vec2(1e9,-1.0);
}
vec3 calcN(vec3 p, float t){
  float e=0.0006+0.0004*t; vec2 k=vec2(1.0,-1.0);
  return normalize(k.xyy*map(p+k.xyy*e,8).x+k.yyx*map(p+k.yyx*e,8).x+k.yxy*map(p+k.yxy*e,8).x+k.xxx*map(p+k.xxx*e,8).x);
}
vec3 calcNObj(int i, vec3 p){
  float e=0.001; vec2 k=vec2(1.0,-1.0);
  return normalize(k.xyy*objSDF(i,p+k.xyy*e,6)+k.yyx*objSDF(i,p+k.yyx*e,6)+k.yxy*objSDF(i,p+k.yxy*e,6)+k.xxx*objSDF(i,p+k.xxx*e,6));
}
float shadow(vec3 ro, vec3 rd, int steps){
  float res=1.0, t=0.04, k=mix(28.0,170.0,uLook);   // retro look = hard-edged 90s shadows
  for(int i=0;i<64;i++){ if(i>=steps) break;
    float h=map(ro+rd*t,6).x; res=min(res,k*h/t);
    if(res<0.002) return 0.0;
    t+=clamp(h,0.02,2.5); if(t>90.0) break; }
  return clamp(res,0.0,1.0);
}
float cloudD(vec2 q){ float a=0.0,b=0.5; for(int i=0;i<6;i++){ a+=b*noise(q); q=M2*q*2.1; b*=0.5; } return a; }
// big sky planets: a sphere of angular radius R one unit away, optional tilted ring
vec3 planets(vec3 rd, vec3 col, float veil){
  for(int k=0;k<2;k++){
    vec4 P=uPl[k]; if(P.w<=0.0) continue;
    vec3 md=P.xyz; float R=P.w; int ty=int(uPlC[k].w+0.5); vec3 c1=uPlC[k].rgb, c2=uPlC2[k].rgb;
    float b=dot(rd,md); if(b<=0.0) continue;
    vec3 v=rd-md*b; float dd=length(v);
    col+=c1*0.2*exp(-dd/R*1.4)*(ty==1?1.0:0.4)*veil;               // soft glow around it
    vec3 mu=normalize(cross(md,vec3(0,1,0))), mv=cross(mu,md);
    vec2 l=vec2(dot(v,mu),dot(v,mv))/R; float pr=length(l);
    float pa=smoothstep(1.0,0.97,pr); vec3 pc=vec3(0.0); float tS=1e9;
    if(pr<1.0){
      float z=sqrt(max(1.0-pr*pr,0.0)); vec3 n=l.x*mu+l.y*mv-z*md; tS=b-z*R;
      if(ty==1){ float cr=noise(l*4.0+11.0)*0.6+noise(l*11.0+3.0)*0.4; pc=c1*(0.55+0.55*cr)*(0.45+0.55*z)*1.7; }
      else { float lit=max(dot(n,uSun),0.0)*0.95+0.05;
        float band=0.5+0.5*sin(l.y*13.0+noise(l*vec2(1.5,6.0))*4.0+noise(l*9.0)*1.2);
        pc=mix(c2,c1,band)*lit*1.6; }
    }
    float ra=0.0; vec3 rc=vec3(0.0); float tR=1e9;
    if(ty==3){
      vec3 N=normalize(vec3(0.22,1.0,0.3)); float dn=dot(rd,N);
      if(abs(dn)>1e-4){ float t=dot(md,N)/dn; float r=length(rd*t-md)/R;
        if(t>0.0 && r>1.3 && r<2.4){ tR=t;
          float band=0.55+0.45*sin(r*41.0)*sin(r*13.0+1.0);
          ra=smoothstep(1.3,1.38,r)*smoothstep(2.4,2.3,r)*(0.3+0.7*band)*(1.0-0.75*smoothstep(1.9,1.94,r)*smoothstep(2.0,1.96,r));   // with a Cassini-style gap
          rc=mix(c1,c2,0.35)*(0.35+0.9*abs(dot(N,uSun)))*1.4; } }
    }
    pa*=veil; ra*=veil*0.9;
    if(tR<tS){ col=mix(col,pc,pa); col=mix(col,rc,ra); } else { col=mix(col,rc,ra); col=mix(col,pc,pa); }
  }
  return col;
}
vec3 skyCol(vec3 rd){
  float y=max(rd.y,0.0);
  vec3 col=mix(cHor,cTop,pow(y,0.5));
  float s=max(dot(rd,uSun),0.0);
  col+=cSun*0.3*pow(s,10.0);
  if(uRays>0.0){                                   // light rays fanning out from the sun
    vec3 b1=normalize(cross(uSun,vec3(0,1,0))), b2=cross(b1,uSun);
    float ang=atan(dot(rd,b2),dot(rd,b1)); vec2 cs=vec2(cos(ang),sin(ang));
    float ray=pow(0.5+0.5*sin(ang*15.0+5.0*noise(cs*2.3+4.0)),5.0)*(0.5+0.5*noise(cs*6.0));
    col+=cSun*uRays*ray*pow(s,2.5)*0.55*(1.0-uNoSun);
  }
  col+=cSun*smoothstep(0.9989,0.9994,s)*7.0*(1.0-uNoSun);
  if(uStars>0.0){ float st=hash3(floor(rd*420.0)); col+=uStars*smoothstep(0.9965,1.0,st)*smoothstep(0.0,0.3,y)*1.6; }
  float dens=0.0;
  if(uClouds>0.0 && rd.y>0.0){
    vec2 q=rd.xz/(rd.y+0.1)*1.1+vec2(3.1,7.7);
    float c=cloudD(q), c2=cloudD(q+uSun.xz*0.18);
    float th=0.78-uClouds*0.42;
    dens=smoothstep(th,th+0.2,c)*smoothstep(0.0,0.14,rd.y);
    float lit=clamp(1.15-(c2-c)*3.5,0.35,1.25);
    vec3 cc=mix(cTop*0.35+cHor*0.45, cSun*0.85+cHor*0.25, clamp(lit-0.25,0.0,1.0));
    col=mix(col,cc,dens);
  }
  float hz=uHaze*exp(-y*7.0);
  col=mix(col,cHaze,hz);
  return planets(rd,col,(1.0-0.85*dens)*(1.0-0.6*hz));
}
vec3 fogc(vec3 col, vec3 rd, float t){ return mix(col, mix(cHaze,cHor,0.5), 1.0-exp(-t*uFog)); }

struct Mat { vec3 alb; float refl; float spec; vec3 tint; float glass; vec3 emi; };
Mat getMat(int i, vec3 p, vec3 n){
  int m=int(uC[i].x+0.5); vec3 q=toLocal(i,p); vec3 s=uB[i].xyz;
  Mat M; M.alb=vec3(0.7); M.refl=0.0; M.spec=0.3; M.tint=vec3(1.0); M.glass=0.0; M.emi=vec3(0.0);
  if(m==0){ M.alb=vec3(0.015); M.refl=0.92; M.tint=vec3(0.95,0.97,1.0); M.spec=1.0; }
  else if(m==1){ M.glass=1.0; M.spec=1.0; M.tint=vec3(0.86,0.95,0.97); }
  else if(m==2){ M.alb=vec3(0.06,0.035,0.0); M.refl=0.88; M.tint=vec3(1.0,0.7,0.26); M.spec=1.0; }
  else if(m==3){ M.alb=vec3(0.55,0.025,0.015); M.refl=0.1; M.spec=0.9; }
  else if(m==4){ M.alb=vec3(0.015,0.09,0.55); M.refl=0.1; M.spec=0.9; }
  else if(m==5){ float v=fbm3(q*1.2); float vein=abs(sin(q.x*2.6+q.y*1.8+q.z*0.7+v*10.0));
    M.alb=mix(vec3(0.16,0.15,0.17),vec3(0.82,0.8,0.76),smoothstep(0.0,0.3,vein))*(0.9+0.1*noise3(q*9.0)); M.refl=0.14; M.spec=0.7; }
  else if(m==6){ float v=fbm3(q*2.2); M.alb=mix(vec3(0.12,0.085,0.06),vec3(0.45,0.37,0.28),v)*(0.75+0.5*noise3(q*11.0)); M.spec=0.05; }
  else if(m==7){ vec3 c=floor(q*1.8+0.001); float k=mod(c.x+c.y+c.z,2.0); M.alb=mix(vec3(0.02),vec3(0.8),k); M.refl=0.18; M.spec=0.7; }
  else if(m==8){
    float hgt=(q.y+s.y)/(2.0*s.y); float nz=noise3(q*1.3);
    vec3 rock=mix(vec3(0.24,0.18,0.13),vec3(0.52,0.44,0.36),fbm3(q*vec3(0.5,5.0,0.5)));
    float grass=smoothstep(0.72,0.86,n.y)*(1.0-smoothstep(0.25,0.5,hgt+0.12*nz));
    vec3 c=mix(rock,vec3(0.11,0.22,0.05)*(0.8+0.4*nz),grass);
    float sn=smoothstep(0.56,0.66,hgt+0.1*nz+0.18*(n.y-0.6))*smoothstep(0.4,0.65,n.y);
    M.alb=mix(c,vec3(0.88,0.9,0.95),sn); M.spec=0.05+0.4*sn;
  }
  else if(m==9){ M.alb=vec3(0.78,0.77,0.74); M.refl=0.08; M.spec=0.8; }
  else if(m==10){ M.alb=vec3(0.0); M.spec=0.0; M.emi=vec3(2.4,1.25,0.45); }                        // glow
  else if(m==11){ M.glass=1.0; M.spec=1.0; M.tint=vec3(0.5,0.85,1.0)*(0.85+0.3*noise3(q*3.0)); }  // ice
  return M;
}
Mat groundMat(vec3 p, float t){
  Mat M; M.refl=0.0; M.spec=0.1; M.tint=vec3(1.0); M.glass=0.0; M.emi=vec3(0.0);
  int g=int(uGround+0.5);
  if(g==0){ vec2 c=floor(p.xz/2.5); float k=mod(c.x+c.y,2.0); vec3 a=mix(vec3(0.015),vec3(0.75),k);
    M.alb=mix(a,vec3(0.38),smoothstep(30.0,150.0,t)); M.refl=0.22; M.spec=0.6; }
  else if(g==1){ float r=noise(p.xz*vec2(0.5,2.2)+3.0*noise(p.xz*0.25)); M.alb=vec3(0.62,0.45,0.24)*(0.8+0.3*r)*(0.92+0.16*noise(p.xz*9.0)); }
  else if(g==2){ M.alb=vec3(0.09,0.2,0.04)*(0.7+0.6*noise(p.xz*0.7))*(0.8+0.4*noise(p.xz*8.0)); }
  else if(g==3){ float v=noise(p.xz*0.4)*0.6+noise(p.xz*1.7)*0.3+noise(p.xz*7.0)*0.1; M.alb=vec3(0.26,0.24,0.22)*(0.5+v); }
  else if(g==4){ M.alb=vec3(0.008,0.008,0.012); M.refl=0.88; M.spec=1.0; }                         // mirror floor
  else {                                                                                            // lava
    vec2 q=p.xz*0.32; float cr=abs(noise(q+2.0*noise(q*0.45+7.0))-0.5)*2.0;
    float hot=1.0-smoothstep(0.0,0.1+0.08*noise(p.xz*1.9),cr);
    hot=mix(hot,0.28,smoothstep(35.0,140.0,t));
    M.alb=vec3(0.07,0.04,0.035)*(0.6+0.8*noise(p.xz*2.7)); M.spec=0.2;
    M.emi=vec3(3.2,0.85,0.12)*hot+vec3(0.35,0.05,0.0)*(1.0-cr)*(1.0-cr);
  }

}
vec3 light(vec3 n, vec3 rd, Mat M, float sh){
  float dif=max(dot(n,uSun),0.0)*sh;
  vec3 h=normalize(uSun-rd);
  float spe=pow(max(dot(n,h),0.0),mix(90.0,160.0,uLook))*M.spec*sh*mix(1.0,1.6,uLook);
  vec3 amb=cTop*0.32*(0.6+0.4*n.y)+cHor*0.12;
  if(uGround>4.5 && uSeaOn<0.5) amb+=vec3(1.0,0.3,0.05)*0.5*(0.5-0.5*n.y);                       // lava lights things from below
  return M.alb*(dif*cSun*2.0+amb)+cSun*spe*1.6+M.emi;
}
vec3 waterBase(){ return vec3(0.0,0.035,0.07)*(cSun+cTop)*0.8; }
vec3 waterN(vec3 p, float t){
  vec2 g=noised(p.xz*0.5).yz*0.5+noised(M2*p.xz*1.6+3.0).yz*0.3+noised(p.xz*4.1).yz*0.15;
  g*=exp(-t*0.015)*(1.0-0.94*uCalm); return normalize(vec3(-g.x*0.22,1.0,-g.y*0.22));

vec3 glowShade(Mat M, vec3 n, vec3 rd){ return M.emi*(0.55+0.9*pow(max(dot(-rd,n),0.0),2.0)); }
// one bounce: shading without further reflections
vec3 shade2(vec3 ro, vec3 rd){
  vec2 h=hitScene(ro,rd,100,5);
  if(h.y>-1.5 && h.y<-0.5) return skyCol(rd);
  vec3 p=ro+rd*h.x; vec3 col;
  if(h.y<-1.5){
    if(uSeaOn>0.5){ vec3 n=waterN(p,h.x); float fre=0.1+0.9*pow(1.0-max(dot(-rd,n),0.0),5.0); col=mix(waterBase(),skyCol(reflect(rd,n)),fre); }
    else { Mat M=groundMat(p,h.x); col=light(vec3(0,1,0),rd,M,shadow(p+vec3(0,0.02,0),uSun,32)); col=mix(col,skyCol(reflect(rd,vec3(0,1,0))),M.refl*0.7); }
  } else {
    int i=int(h.y+0.5); vec3 n=calcN(p,h.x); Mat M=getMat(i,p,n);
    if(M.glass>0.5){ float fre=0.05+0.95*pow(1.0-max(dot(-rd,n),0.0),5.0); col=mix(skyCol(refract(rd,n,0.9))*M.tint,skyCol(reflect(rd,n)),fre); }
    else if(dot(M.emi,M.emi)>0.0 && M.spec==0.0){ col=glowShade(M,n,rd); }
    else { col=light(n,rd,M,shadow(p+n*0.03,uSun,24)); col=mix(col,skyCol(reflect(rd,n))*M.tint,M.refl); }
  }
  return fogc(col,rd,h.x);
}
vec3 shadeWater(vec3 p, vec3 rd, float t){
  vec3 n=waterN(p,t);
  vec3 r=reflect(rd,n); r.y=abs(r.y)+0.002; r=normalize(r);
  float fre=0.05+0.95*pow(1.0-max(dot(-rd,n),0.0),5.0);
  vec3 refl=shade2(p+vec3(0,0.01,0),r);
  float sh=shadow(p+vec3(0,0.02,0),uSun,48);
  vec3 col=mix(waterBase()*(0.4+0.6*sh),refl,max(fre,mix(0.22,0.6,uCalm)));
  col+=cSun*pow(max(dot(r,uSun),0.0),350.0)*5.0*sh;
  return col;
}
vec3 shadeGround(vec3 p, vec3 rd, float t){
  Mat M=groundMat(p,t); vec3 n=vec3(0,1,0);
  float sh=shadow(p+n*0.02,uSun,64);
  vec3 col=light(n,rd,M,sh);
  if(M.refl>0.0){ vec3 rf=shade2(p+n*0.01,reflect(rd,n)); col=mix(col,rf,M.refl*(0.6+0.4*pow(1.0-max(-rd.y,0.0),3.0))); }
  return col;
}
vec3 shadeObj(int i, vec3 p, vec3 rd, float t){
  vec3 n=calcN(p,t); Mat M=getMat(i,p,n);
  if(int(uC[i].x+0.5)==10) return glowShade(M,n,rd);
  if(M.glass>0.5){
    float fre=0.04+0.96*pow(1.0-max(dot(-rd,n),0.0),5.0);
    vec3 rfl=shade2(p+n*0.01,reflect(rd,n));
    vec3 r1=refract(rd,n,1.0/1.5);
    vec3 q=p-n*0.02; float tt=0.0;
    for(int k=0;k<60;k++){ float d=-objSDF(i,q+r1*tt,6); if(d<0.001) break; tt+=max(d,0.01); }
    vec3 pe=q+r1*tt; vec3 ne=calcNObj(i,pe);
    vec3 r2=refract(r1,-ne,1.5); if(dot(r2,r2)<0.01) r2=reflect(r1,-ne);
    vec3 rfr=shade2(pe+ne*0.03,normalize(r2))*M.tint*exp(-tt*0.06);
    return mix(rfr,rfl,fre)+cSun*pow(max(dot(reflect(rd,n),uSun),0.0),220.0)*3.0;
  }
  float sh=shadow(p+n*0.03,uSun,64);
  vec3 col=light(n,rd,M,sh);
  if(M.refl>0.0){
    vec3 rf=shade2(p+n*0.02,reflect(rd,n));
    float fre=M.refl+(1.0-M.refl)*pow(1.0-max(dot(-rd,n),0.0),5.0)*(M.refl>0.5?0.6:0.2);
    col=mix(col,rf*M.tint,clamp(fre,0.0,1.0));
    col+=cSun*pow(max(dot(reflect(rd,n),uSun),0.0),180.0)*M.spec*sh*2.0;
  }
  return col;
}
const float BAYER[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
void main(){
  vec2 uv=(2.0*(gl_FragCoord.xy+uOff)-uRes)/uRes.y;

    loadState(p); upload(TW,TH); gl.drawArrays(gl.TRIANGLES,0,3); gl.readPixels(0,0,TW,TH,gl.RGBA,gl.UNSIGNED_BYTE,px);
  } finally { gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(vp[0],vp[1],vp[2],vp[3]); if(sc) gl.enable(gl.SCISSOR_TEST);
    objs=snap.o; Object.assign(W,snap.W); Object.assign(cam,snap.cam); }
  const img=tctx.createImageData(TW,TH); for(let y=0;y<TH;y++) img.data.set(px.subarray((TH-1-y)*TW*4,(TH-y)*TW*4),y*TW*4);
  tctx.putImageData(img,0,0); return tcv.toDataURL('image/jpeg',.88);
}
function makeThumbs(){ SCENES.forEach(p=>{p.img=thumbOf(p);}); }
function loadScene(i){
  if(flying) stopFly(); const p=SCENES[i]; loadState(p); curScene=i; curComm=-1; sel=-1;
  buildStrip(); buildCtx(); updCount(); preview(); lcd(p.n+'. Rendering…'); setTimeout(()=>{if(curScene===i)render();},120);
}

// ---------- sharing: the whole world fits in the link (#s=...)
const REPO='alex4nder1998/dreamscape-97';
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const r2=v=>Math.round(v*100)/100, r3=v=>Math.round(v*1000)/1000;
function encodeScene(){
  const d=[1,W.sky,W.ground,W.sea?1:0,r2(W.calm),r2(W.elev),r3(W.az-cam.yaw-Math.PI),r2(W.clouds),r2(W.hz),r2(W.fog),r2(W.rays),r2(W.flare),W.retro?1:0,
    [r3(cam.yaw),r3(cam.pitch),r2(cam.dist),...cam.ta.map(r2)],
    objs.map(o=>[o.t,o.m,r2(o.x),r2(o.z),r3(o.size),r3(o.stretch),r2(o.lift),r3(o.rot),r3(o.tilt||0),r2(o.seed)]),W.square?1:0];
  if(W.cover.st&&(W.cover.band.trim()||W.cover.album.trim())) d.push([W.cover.st,W.cover.band.slice(0,36),W.cover.album.slice(0,48)]);
  return btoa(JSON.stringify(d).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
// links and gallery entries come from strangers: every value is checked and clamped, anything odd is dropped
function coverOf(a){ const T=(v,n)=>typeof v==='string'?v.replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]/g,'').slice(0,n):'';
  if(!Array.isArray(a)) return {st:0,band:'',album:''}; const st=Number.isInteger(a[0])&&a[0]>0&&a[0]<COVERS.length?a[0]:0; return {st,band:T(a[1],36),album:T(a[2],48)}; }
function decodeScene(str){
  try{
    if(typeof str!=='string'||str.length>6000||!/^[A-Za-z0-9_-]+$/.test(str)) return null;
    const d=JSON.parse(atob(str.replace(/-/g,'+').replace(/_/g,'/')));
    if(!Array.isArray(d)||d[0]!==1||!Array.isArray(d[13])||!Array.isArray(d[14])) return null;
    const N=(v,lo,hi,df)=>typeof v==='number'&&isFinite(v)?Math.min(hi,Math.max(lo,v)):df, I=(v,lo,hi,df)=>Math.round(N(v,lo,hi,df)), c=d[13];
    return {sky:I(d[1],0,SKIES.length-1,0),ground:I(d[2],0,GROUNDS.length-1,0),sea:d[3]===1,calm:N(d[4],0,1,0),elev:N(d[5],1,90,30),az:N(d[6],-50,50,0),
      clouds:N(d[7],0,1,.5),hz:N(d[8],0,1,.3),fog:N(d[9],0,1,.1),rays:N(d[10],0,1,0),flare:N(d[11],0,1,0),retro:d[12]!==0,square:d.length>15?d[15]===1:null,cover:coverOf(d[16]),
      cam:{yaw:N(c[0],-100,100,.35),pitch:N(c[1],-.05,1.35,.16),dist:N(c[2],4,140,17),ta:[N(c[3],-300,300,0),N(c[4],-50,50,1.6),N(c[5],-300,300,0)]},
      o:d[14].slice(0,10).filter(a=>Array.isArray(a)&&Number.isInteger(a[0])&&TNAME[a[0]]).map(a=>[a[0],N(a[2],-250,250,0),N(a[3],-250,250,0),
        {m:I(a[1],0,MATS.length-1,0),size:N(a[4],.2,4,1),stretch:N(a[5],.2,4,1),lift:N(a[6],0,12,0),rot:N(a[7],-100,100,0),tilt:N(a[8],0,1.6,0),seed:N(a[9],0,100,1)}])};
  }catch(e){ return null; }
}
function shareURL(){ return location.href.split('#')[0]+'#s='+encodeScene(); }
async function shareScene(){
  const url=shareURL(); try{ history.replaceState(null,'',url); }catch(e){}
  try{ if(navigator.share&&matchMedia('(pointer:coarse)').matches){ await navigator.share({title:'My Dreamscape 97 world',url}); lcd('Shared.'); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); lcd('Link copied. Paste it anywhere.'); }
  catch(e){ lcd('Copy the link from the address bar.'); }
}
function submitScene(){
  const q=new URLSearchParams({template:'gallery.yml',title:'Gallery: ',link:shareURL()});
  window.open('https://github.com/'+REPO+'/issues/new?'+q,'_blank','noopener');
  lcd('Opening GitHub: name your world, then press Create.');
}

// ---------- community gallery: GitHub issues the owner has labelled "featured"
let community=null, commLoading=false, commErr=false, curComm=-1;
async function loadCommunity(){
  if(community||commLoading) return; commLoading=true; let list=null;
  try{ const c=JSON.parse(localStorage.getItem('dc97-gallery')||'null'); if(c&&Array.isArray(c.list)&&Date.now()-c.t<6e5) list=c.list; }catch(e){}
  if(!list){
    try{ const r=await fetch('https://api.github.com/repos/'+REPO+'/issues?labels=featured&state=all&per_page=40&sort=created&direction=desc',{headers:{Accept:'application/vnd.github+json'}});
      if(!r.ok) throw new Error('HTTP '+r.status); const js=await r.json(); if(!Array.isArray(js)) throw new Error('bad reply');
      list=js.filter(x=>x&&!x.pull_request).map(x=>{const m=/#s=([A-Za-z0-9_-]{10,6000})/.exec(String(x.body||''));
        return m?{n:String(x.title||'').replace(/^\s*gallery:\s*/i,'').trim().slice(0,40)||'Untitled',by:String((x.user&&x.user.login)||'').slice(0,39),s:m[1]}:null;}).filter(Boolean);
      try{ localStorage.setItem('dc97-gallery',JSON.stringify({t:Date.now(),list})); }catch(e){}
    }catch(e){ console.warn('Gallery unavailable:',e); list=[]; commErr=true; }
  }
  community=[];
  for(const it of list){ const p=decodeScene(it.s); if(!p) continue; p.n=String(it.n); p.by=String(it.by); try{ p.img=thumbOf(p); }catch(e){ p.img=''; } community.push(p); }
  commLoading=false; if(tab==='scenes') buildStrip();
}
function loadComm(i){
  if(flying) stopFly(); const p=community[i]; loadState(p); curComm=i; curScene=-1; sel=-1;
  buildStrip(); buildCtx(); updCount(); preview(); lcd(p.n+'. Rendering…'); setTimeout(()=>{if(curComm===i)render();},120);
}
function loadFromHash(){
  const m=/^#s=([A-Za-z0-9_-]+)$/.exec(location.hash); if(!m) return false;
  const p=decodeScene(m[1]); if(!p){ lcd('That link looks broken, so here is the default world.'); return false; }
  if(flying) stopFly(); loadState(p); curScene=-1; curComm=-1; sel=-1; return true;
}
addEventListener('hashchange',()=>{ if(loadFromHash()){ buildStrip(); buildCtx(); updCount(); preview(); lcd('Shared world loaded. Rendering…'); setTimeout(render,120); } });

// ---------- sun dial (relative to the camera: top = sun in front of you)
let dialEl=null;
function placeSun(){ if(!dialEl) return; const i=dialEl.querySelector('i'); const a=W.az-(cam.yaw+Math.PI); const r=(1-W.elev/90)*28;
  i.style.left=(33+r*Math.sin(a))+'px'; i.style.top=(33-r*Math.cos(a))+'px';
  const S=SKIES[W.sky]; dialEl.style.background='radial-gradient(circle at 50% 50%,'+S.top+' 0,'+S.top+' 35%,'+S.hor+' 100%)'; }
function setupDial(d){ dialEl=d; placeSun();
  const mv=e=>{const b=d.getBoundingClientRect();const x=e.clientX-b.left-33,y=e.clientY-b.top-33;const r=Math.min(28,Math.hypot(x,y));
    W.elev=Math.max(1,Math.round((1-r/28)*90)); W.az=cam.yaw+Math.PI+Math.atan2(x,-y); placeSun(); lcd('Sun height '+W.elev+'°'); changed();};
  d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);mv(e);d.onpointermove=mv;};
  d.onpointerup=d.onpointercancel=()=>{d.onpointermove=null;};
}

// ---------- camera trackball
const ball=$('#ball'); let bl=null;
ball.onpointerdown=e=>{ball.setPointerCapture(e.pointerId);bl=[e.clientX,e.clientY];};
ball.onpointermove=e=>{if(!bl)return;orbit(e.clientX-bl[0],e.clientY-bl[1]);bl=[e.clientX,e.clientY];};
ball.onpointerup=ball.onpointercancel=()=>{bl=null;};
function orbit(dx,dy){cam.yaw-=dx*0.012;cam.pitch=Math.min(1.35,Math.max(-0.05,cam.pitch+dy*0.009));placeSun();changed();}

// ---------- viewport: tap to select, drag to move (Edit) or orbit, pinch/scroll to zoom
const pts=new Map(); let down=null, pinch=null, dragHit=null;
function rayAt(x,y){const [w,h]=vw();const C=camera();const ux=(2*x-w)/h,uy=(h-2*y)/h;
  return {ro:C.ro,rd:norm([ux*C.uu[0]+uy*C.vv[0]+1.7*C.ww[0],ux*C.uu[1]+uy*C.vv[1]+1.7*C.ww[1],ux*C.uu[2]+uy*C.vv[2]+1.7*C.ww[2]])};}
function groundAt(x,y,yy){const r=rayAt(x,y);if(Math.abs(r.rd[1])<1e-4)return null;const t=(yy-r.ro[1])/r.rd[1];if(t<0||t>500)return null;return [r.ro[0]+r.rd[0]*t,r.ro[2]+r.rd[2]*t];}
function pick(x,y){const r=rayAt(x,y);let best=-1,bt=1e9;
  objs.forEach((o,i)=>{const g=geom(o);const rad=Math.hypot(...g.s)*(o.t>=7?.75:.85);const oc=sub(r.ro,g.p);const b=dot(oc,r.rd),c=dot(oc,oc)-rad*rad,h=b*b-c;if(h<0)return;const t=-b-Math.sqrt(h);if(t>0&&t<bt){bt=t;best=i;}});
  return best;}
function local(e){const b=stage.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];}
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);const p=local(e);pts.set(e.pointerId,p);
  if(pts.size===1){down={x:p[0],y:p[1],moved:false};dragHit=null;
    if(tab==='edit'&&sel>=0){const o=objs[sel];const [w,h]=vw();const sp=project(camera(),[o.x,0,o.z],w,h);dragHit=sp?{sx:sp[0],sy:sp[1],px:p[0],py:p[1]}:null;}}
  else if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),dist:cam.dist};down=null;}});
view.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=local(e),prev=pts.get(e.pointerId);pts.set(e.pointerId,p);
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);cam.dist=Math.min(140,Math.max(4,pinch.dist*pinch.d/d));changed();return;}
  if(!down)return; if(!down.moved&&Math.hypot(p[0]-down.x,p[1]-down.y)<6)return; down.moved=true;
  if(tab==='edit'&&sel>=0&&dragHit){const o=objs[sel];const nh=groundAt(dragHit.sx+p[0]-dragHit.px,dragHit.sy+p[1]-dragHit.py,0);if(nh&&Math.hypot(nh[0],nh[1])<250){o.x=nh[0];o.z=nh[1];changed();}}
  else orbit(p[0]-prev[0],p[1]-prev[1]);});
const pup=e=>{const p=pts.get(e.pointerId);pts.delete(e.pointerId);if(pts.size<2)pinch=null;
  if(down&&!down.moved&&p&&e.type==='pointerup'){const i=pick(p[0],p[1]);
    if(i>=0){select(i);if(tab!=='edit')setTab('edit');else lcd('Editing the '+TNAME[objs[i].t]+'. Drag in the view to move it.');}
    else if(sel>=0){select(-1);if(tab==='edit')lcd('Nothing selected.');}}
  if(pts.size===0){down=null; if(autoR&&!rendered&&!job&&!flying){ clearTimeout(arT); const g=gen; arT=setTimeout(()=>{ if(g===gen&&!pts.size&&!flying&&$('#overlay').hidden) render(); },650);} }};
view.addEventListener('pointerup',pup);view.addEventListener('pointercancel',pup);
view.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.min(140,Math.max(4,cam.dist*Math.exp(e.deltaY*0.001)));changed();},{passive:false});
let rt=0, lastWH='';
new ResizeObserver(()=>{const k=view.clientWidth+'x'+view.clientHeight; if(k===lastWH) return; const first=!lastWH; lastWH=k; if(first) return;
  layoutStage(); clearTimeout(rt); rt=setTimeout(()=>{if(flying) return; if(rendered||job)render();else preview();},150);}).observe(view);

// ---------- frame + full screen buttons, keyboard shortcuts
const prefs={get(k){try{return localStorage.getItem('dc97-'+k);}catch(e){return null;}},set(k,v){try{localStorage.setItem('dc97-'+k,v);}catch(e){}}};
function setSquare(on){ W.square=on; prefs.set('square',on?'1':'0'); layoutStage(); lcd(on?'Square 1:1 frame: renders and saves come out square.':'Full frame.'); if(!flying){ if(rendered) render(); else preview(); } }
let fsByApi=false;
function setImmersive(on){
  document.body.classList.toggle('imm',on); $('#fsBtn').classList.toggle('on',on);
  if(on){ const el=document.documentElement; if(el.requestFullscreen&&!document.fullscreenElement){ el.requestFullscreen().then(()=>{fsByApi=true;}).catch(()=>{}); } }
  else if(document.fullscreenElement&&document.exitFullscreen){ fsByApi=false; document.exitFullscreen().catch(()=>{}); }
}
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&fsByApi){ fsByApi=false; document.body.classList.remove('imm'); $('#fsBtn').classList.remove('on'); } });
$('#vbtns').addEventListener('pointerdown',e=>e.stopPropagation());
$('#sqBtn').onclick=()=>setSquare(!W.square);
$('#fsBtn').onclick=()=>setImmersive(!document.body.classList.contains('imm'));
$('#rendBtn2').onclick=()=>rbtn.onclick(); $('#undoBtn').onclick=undo;
autoR=prefs.get('auto')!=='0'; $('#autoBtn').classList.toggle('on',autoR);
function setAuto(on){ autoR=on; prefs.set('auto',on?'1':'0'); $('#autoBtn').classList.toggle('on',on); lcd(on?'Auto render on: it renders by itself when you stop editing.':'Auto render off: tap Render when you want the full picture.'); if(on&&!rendered&&!job&&!flying) render(); }
$('#autoBtn').onclick=()=>setAuto(!autoR);
$('#recBtn').onclick=()=>{ if(rec) stopRec(); else startRec(); }; $('#redoBtn').onclick=redo;
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&$('#overlay').hidden){ const z=e.key.toLowerCase();
    if(z==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; } if(z==='y'){ e.preventDefault(); redo(); return; } }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key, o=objs[sel];
  if(!$('#overlay').hidden){ if(k==='Escape'){ $('#closeBtn').onclick(); e.preventDefault(); } return; }
  if(k==='r'||k==='R'){ rbtn.onclick(); }
  else if(k==='f'||k==='F'){ setImmersive(!document.body.classList.contains('imm')); }
  else if(k==='s'||k==='S'){ setSquare(!W.square); }
  else if(k==='a'||k==='A'){ setAuto(!autoR); }
  else if(k==='v'||k==='V'){ if(rec) stopRec(); else startRec(); }
  else if(k==='Escape'){ if(document.body.classList.contains('imm')) setImmersive(false); else if(sel>=0){ select(-1); lcd('Nothing selected.'); } else return; }
  else if((k==='Delete'||k==='Backspace')&&o){ objs.splice(sel,1); select(-1); lcd('Deleted.'); changed(); }
  else if(k.startsWith('Arrow')&&o){ const C=camera(),f=norm([C.ww[0],0,C.ww[2]]),r=[-f[2],0,f[0]],st=e.shiftKey?2:.5;
    const dx=k==='ArrowRight'?1:k==='ArrowLeft'?-1:0, dz=k==='ArrowUp'?1:k==='ArrowDown'?-1:0;
    o.x+=(r[0]*dx+f[0]*dz)*st; o.z+=(r[2]*dx+f[2]*dz)*st; changed(); }
  else return;
  e.preventDefault();
});

// ---------- start
defaultScene(); W.square=prefs.get('square')==='1'; try{makeThumbs();}catch(e){console.error(e);} const shared=loadFromHash(); let back=false;
if(!shared){ let last=null; try{ last=localStorage.getItem('dc97-last'); }catch(e){} const p=last&&decodeScene(last); if(p){ loadState(p); back=true; } }
layoutStage(); setTab('create'); lcd(shared?'Shared world loaded. Rendering…':back?'Welcome back. Your last world is restored (Clear or a scene starts fresh).':'Welcome to Dreamscape 97. Rendering…');
requestAnimationFrame(()=>{preview(); setTimeout(render,120);});
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
